    <label for="p1">
      <h3>1. ¿Qué es una pseudo-clase de CSS?</h3>
    </label for=p1>

      <li><input id="p1r3" title="opcion3" name="p1" type="radio"> <label for="p1r3">No existen pseudo-clases en
